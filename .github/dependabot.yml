version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "modernization"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps"
    # Batch routine version bumps into one PR per week. Majors stay as
    # individual PRs (they need real review), and security updates keep
    # Dependabot's default one-PR-per-advisory behaviour so they remain
    # individually visible and fast to merge.
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend_modern"
    schedule:
      interval: "weekly"
    target-branch: "modernization"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps"
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Backend Docker base images (Dockerfile + Dockerfile.prod: python:3.11-slim)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    target-branch: "modernization"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps"
    # Patch/digest bumps of the base image are routine; group them monthly.
    # A major (python 3.11 → 3.x) is a runtime upgrade that needs its own
    # review against CI and mypy, so majors stay individual PRs.
    groups:
      backend-docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Frontend Docker base images (node:20-alpine builder, nginx runtime)
  - package-ecosystem: "docker"
    directory: "/frontend_modern"
    schedule:
      interval: "monthly"
    target-branch: "modernization"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps"
    groups:
      frontend-docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "modernization"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    # Actions bumps are low-risk pin updates; one monthly PR covers them all,
    # majors included — the workflow-lint (actionlint) job catches breakage.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
