services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: openshiksha-postgres
    environment:
      POSTGRES_DB: openshiksha_dev
      POSTGRES_USER: openshiksha
      POSTGRES_PASSWORD: openshiksha
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshiksha"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openshiksha-network

  # Redis (Cache & Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: openshiksha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - openshiksha-network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openshiksha-backend
    # Migrate before serving — otherwise the DB silently drifts behind new
    # migrations and requests blow up mid-flight (e.g. "relation
    # problem_set_versions does not exist" when publishing an assignment).
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://openshiksha:openshiksha@postgres:5432/openshiksha_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openshiksha-network

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openshiksha-celery
    command: celery -A openshiksha worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://openshiksha:openshiksha@postgres:5432/openshiksha_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openshiksha-network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openshiksha-celery-beat
    command: celery -A openshiksha beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://openshiksha:openshiksha@postgres:5432/openshiksha_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openshiksha-network

  # React Frontend (modern)
  frontend:
    build:
      context: ./frontend_modern
      dockerfile: Dockerfile
    container_name: openshiksha-frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend_modern:/app
      - /app/node_modules  # Anonymous volume for node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend_modern/.env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - openshiksha-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local

networks:
  openshiksha-network:
    driver: bridge
