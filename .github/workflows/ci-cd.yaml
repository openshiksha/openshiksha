name: CI/CD Pipeline
# This workflow is triggered on pushes to the repository.
on: push

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Code Quality Tools
              run: pip install black==26.3.1 flake8==7.1.1 isort==5.13.2
              working-directory: backend
            - name: Check formatting (black)
              # TODO: Remove continue-on-error once the codebase has been reformatted
              # Run: cd backend && black . --line-length=120 to fix
              continue-on-error: true
              run: black --check --line-length=120 openshiksha/
              working-directory: backend
            - name: Check import order (isort)
              # TODO: Remove continue-on-error once the codebase has been reformatted
              # Run: cd backend && isort openshiksha/ --profile=black --line-length=120 to fix
              continue-on-error: true
              run: isort --check --profile=black --line-length=120 openshiksha/
              working-directory: backend
            - name: Check style (flake8)
              run: flake8 openshiksha/
              working-directory: backend

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install pip-audit
              run: pip install pip-audit==2.8.0
            - name: Audit dependencies for known CVEs
              run: pip-audit -r requirements.txt
              working-directory: backend

    test:
        name: Test
        runs-on: ubuntu-latest
        services:
            db:
                image: postgres:15
                env:
                    POSTGRES_USER: openshiksha_app
                    POSTGRES_DB: openshiksha_test
                    POSTGRES_PASSWORD: testpass
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: backend
            - name: Run Django system check
              run: python manage.py check
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.development
                DATABASE_URL: postgresql://openshiksha_app:testpass@localhost:5432/openshiksha_test
                REDIS_URL: redis://localhost:6379/0
                SECRET_KEY: test-secret-key-not-for-production
                DEBUG: "True"
            - name: Run migrations
              run: python manage.py migrate
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.development
                DATABASE_URL: postgresql://openshiksha_app:testpass@localhost:5432/openshiksha_test
                REDIS_URL: redis://localhost:6379/0
                SECRET_KEY: test-secret-key-not-for-production
                DEBUG: "True"
            - name: Run Tests
              run: python -m pytest --tb=short -q
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.development
                DATABASE_URL: postgresql://openshiksha_app:testpass@localhost:5432/openshiksha_test
                REDIS_URL: redis://localhost:6379/0
                SECRET_KEY: test-secret-key-not-for-production
                DEBUG: "True"

    frontend:
        name: Frontend (Lint, Types, Tests)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend_modern
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend_modern/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Lint (ESLint)
              run: npm run lint
            - name: Type check (TypeScript)
              run: npm run type-check
            - name: Run tests (Vitest)
              run: npm test -- --run
            - name: Build
              run: npm run build

    build-publish:
        name: Build & Publish
        needs: [lint, security, test, frontend]
        # only run this on qa & prod branches
        if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Extract Branch name for Tagging
              run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
              id: extract_branch
            - name: Build Docker Image & Push to GitHub Container Registry
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    ghcr.io/${{ github.repository }}:${{ steps.extract_branch.outputs.branch }}
                    ghcr.io/${{ github.repository }}:${{ github.sha }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    deploy-prod:
        name: Deploy to Cluster
        needs: build-publish
        # only run this on prod branch
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        steps:
            - name: Set Cluster Context
              uses: azure/k8s-set-context@v3
              with:
                method: kubeconfig
                kubeconfig: '${{ secrets.KUBECONFIG }}'
                context: k3s-personal-server
            - name: Restart pods
              run: kubectl rollout restart deployment openshiksha openshiksha-celery-worker openshiksha-celery-beat -n openshiksha
