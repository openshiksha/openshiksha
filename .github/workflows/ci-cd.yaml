name: CI/CD Pipeline
# This workflow is triggered on pushes to the repository.
on: push

# Cancel in-progress CI runs when a newer commit lands on the same feature
# branch — the older run's results are stale anyway, and waiting on them
# burns minutes and delays feedback. Long-lived branches that gate deploys
# (qa / prod) are excluded: their runs build and publish
# images and roll out to k3s, so cancelling mid-flight could leave the
# cluster pointing at a half-pushed image. For those, each push runs to
# completion and the most recent one wins by ordering.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/qa' && github.ref != 'refs/heads/prod' }}

# Least-privilege default for the GITHUB_TOKEN. Without an explicit block the
# token inherits the repository/org default, which can be the legacy
# read/write-all scope — far more than any of these jobs need. Most jobs only
# check out the repo, so `contents: read` covers them. The two jobs that need
# more declare their own (overriding) block:
#   - `test` adds `pull-requests: write` to post the coverage comment
#   - `build-publish` adds `packages: write` to push images to GHCR
# Setting the floor here keeps every other job (lint, typecheck, security,
# frontend, frontend-e2e, lighthouse, deploy-*) read-only on contents.
permissions:
    contents: read

jobs:
    workflow-lint:
        name: Workflow Lint (actionlint)
        timeout-minutes: 5
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Install actionlint
              # Use the official install script from the actionlint maintainer
              # (rhysd). Pinning to a script URL avoids a third-party action
              # dependency for a job that just runs a static linter.
              id: install-actionlint
              run: |
                bash <(curl --silent --show-error --fail https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                echo "actionlint=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"
            - name: Run actionlint
              # Validates GitHub Actions workflow YAML — catches typos in
              # `uses:` versions, bad expression syntax, mismatched `needs:`
              # references, and other footguns that otherwise only fail at
              # run time. Shellcheck integration is disabled (-shellcheck=)
              # because the inline `gh` script in the coverage-comment step
              # trips style warnings that aren't worth gating CI on.
              run: ${{ steps.install-actionlint.outputs.actionlint }} -color -shellcheck=

    k8s-manifests:
        name: K8s Manifests (kustomize + kubeconform)
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Set up kubectl (provides `kubectl kustomize`)
              # Same action + version the deploy jobs use, so the renderer here
              # matches what actually applies the manifests to the cluster.
              uses: azure/setup-kubectl@v5
              with:
                version: 'v1.31.0'
            - name: Install kubeconform
              run: |
                curl --silent --show-error --fail --location \
                  -o kubeconform.tar.gz \
                  https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
                tar -xzf kubeconform.tar.gz kubeconform
                sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
            - name: Render & schema-validate every overlay
              # Renders each kustomize overlay (base is pulled in transitively)
              # and validates the output against the upstream Kubernetes JSON
              # schemas with kubeconform. `-strict` rejects unknown fields, so a
              # typo'd manifest key (e.g. a mis-spelled probe field) fails here
              # at PR time instead of silently passing CI and only blowing up at
              # `kubectl apply` / rollout on the live cluster. The two deploy
              # jobs render the same overlays, but only on qa/prod *after* the
              # image build — far too late and never on a PR. `-kubernetes-version`
              # is pinned to the version the deploy jobs install.
              run: |
                for overlay in qa prod; do
                  echo "::group::overlay: $overlay"
                  kubectl kustomize "k8s/overlays/$overlay" \
                    | kubeconform -strict -summary -ignore-missing-schemas \
                        -kubernetes-version 1.31.0 -
                  echo "::endgroup::"
                done

    lint:
        name: Lint
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Python Runtime
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Code Quality Tools
              run: pip install black==26.5.1 flake8==7.3.0 isort==8.0.1
              working-directory: backend
            - name: Check formatting (black)
              run: black --check --line-length=120 openshiksha/
              working-directory: backend
            - name: Check import order (isort)
              run: isort --check --profile=black --line-length=120 openshiksha/
              working-directory: backend
            - name: Check style (flake8)
              run: flake8 openshiksha/
              working-directory: backend

    typecheck:
        name: Type Check (mypy)
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Python Runtime
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: backend
            - name: Run mypy
              run: mypy openshiksha/
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production

    security:
        name: Security Audit
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Python Runtime
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install pip-audit
              run: pip install pip-audit==2.8.0
            - name: Audit dependencies for known CVEs
              # GHSA-grgv-6hw6-v9g4: twisted CVE — fix only in 26.4.0rc2 (pre-release, not on PyPI stable).
              # Ignored until twisted 26.4.0 stable is released.
              # PYSEC-2025-183: pyjwt "weak encryption" — disputed by maintainers (key length is
              # chosen by the application using the library, not by pyjwt itself). No fix released.
              run: pip-audit -r requirements.txt --ignore-vuln GHSA-grgv-6hw6-v9g4 --ignore-vuln PYSEC-2025-183
              working-directory: backend

    test:
        name: Test
        timeout-minutes: 20
        runs-on: ubuntu-latest
        # No external services needed — tests use SQLite in-memory and LocMemCache
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Python Runtime
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: backend
            - name: Run Django system check
              run: python manage.py check
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production
            - name: Check for missing migrations
              # Fails if a model was changed without a matching migration.
              # `makemigrations --check` (not `migrate --check`) is what detects
              # model/migration drift; --dry-run avoids writing any files.
              run: python manage.py makemigrations --check --dry-run
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production
            - name: Run migrations
              run: python manage.py migrate
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production
            - name: Run Tests
              # Coverage threshold (--cov-fail-under) is enforced via pytest.ini addopts.
              # Currently set to 90%; measured at 91.6% as of 2026-05-26.
              run: python -m pytest
              working-directory: backend
              env:
                SECRET_KEY: test-secret-key-not-for-production
            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                name: coverage-report
                path: backend/coverage.xml
                retention-days: 14
            - name: Post coverage summary on PR
              # Push-triggered workflow: look up the PR for this branch (if any) and
              # post / update a sticky coverage summary so it shows in code review
              # without opening the artifact zip.
              if: github.ref != 'refs/heads/qa' && github.ref != 'refs/heads/prod'
              working-directory: backend
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')
                if [ -z "$PR_NUMBER" ]; then
                  echo "No open PR for branch ${{ github.ref_name }}; skipping coverage comment."
                  exit 0
                fi
                {
                  echo "## Backend coverage"
                  echo ""
                  echo "<!-- backend-coverage-comment -->"
                  echo ""
                  echo '```'
                  python -m coverage report
                  echo '```'
                  echo ""
                  echo "_Threshold: 90% (enforced by \`--cov-fail-under\` in pytest.ini). Commit ${{ github.sha }}._"
                } > coverage_comment.md
                # Find a prior comment from this workflow by its hidden marker and edit it; otherwise create.
                EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                  --jq '.[] | select(.body | contains("<!-- backend-coverage-comment -->")) | .id' | head -n1)
                if [ -n "$EXISTING" ]; then
                  gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
                    -f body="$(cat coverage_comment.md)" >/dev/null
                  echo "Updated existing coverage comment ${EXISTING} on PR #${PR_NUMBER}."
                else
                  gh pr comment "$PR_NUMBER" --body-file coverage_comment.md
                  echo "Posted new coverage comment on PR #${PR_NUMBER}."
                fi

    frontend:
        name: Frontend (Lint, Types, Tests)
        timeout-minutes: 20
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend_modern
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend_modern/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Audit dependencies for known CVEs
              run: npm audit --audit-level=high
            - name: Lint (ESLint)
              run: npm run lint
            - name: Type check (TypeScript)
              run: npm run type-check
            - name: Run tests (Vitest) with coverage
              # Thresholds enforced via test.coverage.thresholds in vite.config.ts.
              run: npm test -- --run --coverage
            - name: Upload frontend coverage report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                name: frontend-coverage-report
                path: frontend_modern/coverage
                retention-days: 14
            - name: Build
              run: npm run build
            - name: Check bundle-size budget (PERF-06)
              # Fails if the entry chunk grows past the documented ceiling.
              # See docs/perf/budget.md for the raise-the-ceiling protocol.
              run: npm run check:budget

    frontend-e2e:
        name: Frontend E2E (Playwright smoke)
        timeout-minutes: 20
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend_modern
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend_modern/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                path: ~/.cache/ms-playwright
                key: playwright-${{ runner.os }}-${{ hashFiles('frontend_modern/package-lock.json') }}
            - name: Install Playwright browsers
              # `chromium` only — config uses a single chromium project. Add
              # --with-deps so the runner has the required system libs.
              run: npx playwright install --with-deps chromium
            - name: Run Playwright smoke tests
              # playwright.config.ts handles `vite build && vite preview` via
              # its `webServer` block; no separate "build" step needed.
              run: npm run test:e2e
            - name: Upload Playwright HTML report on failure
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                name: playwright-report
                path: frontend_modern/playwright-report
                retention-days: 14
            - name: Upload axe-core a11y report
              # Baseline report from the /design showcase a11y spec. The spec
              # itself is non-blocking (see e2e/a11y.spec.ts); this artifact
              # is how we track the baseline over time before the WCAG 2.1 AA
              # initiative starts.
              uses: actions/upload-artifact@v7
              if: always()
              with:
                name: axe-report
                path: frontend_modern/axe-report
                retention-days: 14

    visual-regression:
        name: Visual Regression (Playwright snapshots)
        timeout-minutes: 20
        runs-on: ubuntu-latest
        # Runs INSIDE the pinned Playwright image so the snapshot-rendering
        # environment is byte-for-byte identical to the one the committed
        # baselines were generated in. A bare ubuntu runner renders system
        # fonts differently, which would make pixel diffs flake even with no
        # real design change. Browsers are preinstalled in the image, so no
        # `playwright install` step is needed (and the version is pinned to
        # match @playwright/test in package-lock.json — keep them in lockstep
        # when bumping Playwright). Refresh protocol for intentional design
        # changes: docs/changes/2026-06-22-visual-regression-activated.md.
        container:
            image: mcr.microsoft.com/playwright:v1.61.0-noble
        defaults:
            run:
                working-directory: frontend_modern
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Run visual-regression snapshots
              # Builds + previews the production bundle (Playwright webServer)
              # and diffs the four public V2 surfaces × 2 viewports against the
              # baselines in e2e/visual.spec.ts-snapshots/. Only @visual-tagged
              # tests run here; the bare-runner frontend-e2e job excludes them.
              run: npm run test:e2e:visual
            - name: Upload visual diff report on failure
              # The HTML report embeds expected/actual/diff PNGs for any surface
              # that regressed — the fastest way to triage a red run.
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                name: visual-regression-report
                path: frontend_modern/playwright-report
                retention-days: 14

    lighthouse:
        name: Lighthouse (runtime perf budget)
        timeout-minutes: 20
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend_modern
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend_modern/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Run Lighthouse CI
              # PERF-07 — runtime-perf budget. Complements the static bundle-size
              # budget (PERF-06, check:budget) with real throttled-mobile metrics
              # (LCP / TBT / CLS) that bundle bytes can't capture. Audits the
              # public, backend-free /design showcase via `vite preview`, the same
              # build users get. Assertions in lighthouserc.json are `warn`-level
              # by design (Lighthouse scores vary run-to-run); the job only fails
              # if collection itself breaks — i.e. a build that won't boot or a
              # crashing /design route. See docs/perf/lighthouse.md for the
              # tighten-to-error protocol.
              run: npm run lighthouse

    # ─── Build & publish the MODERN stack ────────────────────────────────────
    # Two images go to ghcr.io: backend (Django 4.2 + daphne) and frontend
    # (multi-stage build → nginx). The legacy root Dockerfile is intentionally
    # NOT built — see docs/deploy/README.md for why. The matrix lets both
    # images build in parallel.
    build-publish:
        name: Build & Publish (${{ matrix.service }})
        timeout-minutes: 30
        needs: [lint, typecheck, security, test, frontend, frontend-e2e, visual-regression, k8s-manifests]
        if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: backend
                      context: ./backend
                      dockerfile: ./backend/Dockerfile.prod
                    - service: frontend
                      context: ./frontend_modern
                      dockerfile: ./frontend_modern/Dockerfile.prod
                    # BAK-3: version-matched Postgres backup image. Build context
                    # is the repo root so scripts/backup/* is in scope. Ignores
                    # the GIT_SHA/VITE_* build-args harmlessly (it declares none).
                    - service: backup
                      context: .
                      dockerfile: ./backend/Dockerfile.backup
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Extract Branch name + build time for Tagging
              run: |
                echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
                echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
              id: extract_branch
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build & push ${{ matrix.service }} image
              uses: docker/build-push-action@v7
              with:
                context: ${{ matrix.context }}
                file: ${{ matrix.dockerfile }}
                push: true
                tags: |
                    ghcr.io/${{ github.repository_owner }}/openshiksha-${{ matrix.service }}:${{ steps.extract_branch.outputs.branch }}
                    ghcr.io/${{ github.repository_owner }}/openshiksha-${{ matrix.service }}:${{ github.sha }}
                # Bake build identity into the image for /api/v1/version/ (OBS-2).
                # The backend Dockerfile consumes GIT_SHA/BUILD_TIME; the frontend
                # consumes VITE_SENTRY_DSN (OBS-5). Each image ignores the ARGs it
                # doesn't declare, harmlessly. VITE_SENTRY_DSN comes from the repo
                # Actions secret (masked in logs); empty ⇒ frontend reporting stays
                # disabled. A frontend DSN is inlined into the public bundle by
                # design — it is not a confidential value.
                build-args: |
                    GIT_SHA=${{ github.sha }}
                    BUILD_TIME=${{ steps.extract_branch.outputs.build_time }}
                    VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
                cache-from: type=gha,scope=${{ matrix.service }}
                cache-to: type=gha,scope=${{ matrix.service }},mode=max

    # ─── Deploy to QA env ────────────────────────────────────────────────────
    # DISABLED for now: there is no dedicated qa cluster yet. The single droplet
    # currently serves the PROD env, deployed from the `qa` branch (see deploy-prod
    # below). The wiring here is a stale future-state sketch — it still triggers on
    # the retired `modernization` branch, so the `if` below can never match. Before
    # activating, decide which branch should feed a dedicated qa env (the old
    # modernization -> qa flow no longer exists) and update the trigger. Gated off
    # by the `QA_ENV_ENABLED` repo variable (currently unset, so this job never
    # runs). To activate: provision a qa cluster + its `openshiksha-qa` secret,
    # fix the branch trigger, then set the repo Actions variable QA_ENV_ENABLED=true.
    deploy-qa:
        name: Deploy to QA Cluster
        timeout-minutes: 15
        needs: build-publish
        if: github.ref == 'refs/heads/modernization' && vars.QA_ENV_ENABLED == 'true'
        runs-on: ubuntu-latest
        environment: qa
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Set Cluster Context
              uses: azure/k8s-set-context@v5
              with:
                method: kubeconfig
                kubeconfig: '${{ secrets.KUBECONFIG }}'
                context: k3s-personal-server
            - name: Set up kubectl + kustomize
              uses: azure/setup-kubectl@v5
              with:
                version: 'v1.31.0'
            - name: Pin image tags to commit SHA
              # The committed overlay points at the `:qa` tag, but tags can be
              # re-pushed — so we override to the exact SHA we just built. This
              # forces a real new digest into the Deployment spec, which forces
              # a rollout.
              working-directory: k8s/overlays/qa
              run: |
                kubectl kustomize . > /dev/null  # sanity-render before edits
                kustomize edit set image \
                  ghcr.io/${{ github.repository_owner }}/openshiksha-backend=ghcr.io/${{ github.repository_owner }}/openshiksha-backend:${{ github.sha }} \
                  ghcr.io/${{ github.repository_owner }}/openshiksha-frontend=ghcr.io/${{ github.repository_owner }}/openshiksha-frontend:${{ github.sha }}
            - name: Apply qa manifests
              run: kubectl apply -k k8s/overlays/qa
            - name: Wait for rollouts
              run: |
                kubectl -n openshiksha-qa rollout status statefulset/postgres --timeout=180s
                kubectl -n openshiksha-qa rollout status statefulset/redis --timeout=120s
                kubectl -n openshiksha-qa rollout status deployment/backend --timeout=300s
                kubectl -n openshiksha-qa rollout status deployment/frontend --timeout=180s
                kubectl -n openshiksha-qa rollout status deployment/celery-worker --timeout=180s
                kubectl -n openshiksha-qa rollout status deployment/celery-beat --timeout=180s

    # ─── Deploy to Prod env ──────────────────────────────────────────────────
    # Triggered by the `qa` branch: qa is the release branch that promotes to the
    # prod environment (openshiksha.org) on the single droplet. (Future: when a
    # dedicated `main`/`master` branch exists, point this at it and move the qa
    # branch back to deploy-qa above.)
    deploy-prod:
        name: Deploy to Prod Cluster
        timeout-minutes: 15
        needs: build-publish
        if: github.ref == 'refs/heads/qa'
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7
            - name: Set Cluster Context
              uses: azure/k8s-set-context@v5
              with:
                method: kubeconfig
                kubeconfig: '${{ secrets.KUBECONFIG }}'
                context: k3s-personal-server
            - name: Set up kubectl + kustomize
              uses: azure/setup-kubectl@v5
              with:
                version: 'v1.31.0'
            - name: Pin image tags to commit SHA
              working-directory: k8s/overlays/prod
              run: |
                kubectl kustomize . > /dev/null
                kustomize edit set image \
                  ghcr.io/${{ github.repository_owner }}/openshiksha-backend=ghcr.io/${{ github.repository_owner }}/openshiksha-backend:${{ github.sha }} \
                  ghcr.io/${{ github.repository_owner }}/openshiksha-frontend=ghcr.io/${{ github.repository_owner }}/openshiksha-frontend:${{ github.sha }}
            - name: Apply prod manifests
              run: kubectl apply -k k8s/overlays/prod
            - name: Wait for rollouts
              run: |
                kubectl -n openshiksha-prod rollout status statefulset/postgres --timeout=180s
                kubectl -n openshiksha-prod rollout status statefulset/redis --timeout=120s
                kubectl -n openshiksha-prod rollout status deployment/backend --timeout=300s
                kubectl -n openshiksha-prod rollout status deployment/frontend --timeout=180s
                kubectl -n openshiksha-prod rollout status deployment/celery-worker --timeout=180s
                kubectl -n openshiksha-prod rollout status deployment/celery-beat --timeout=180s
