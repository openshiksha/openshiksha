apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # initContainer runs migrations before the daphne process starts.
      # Idempotent — safe on every rollout. If it fails the pod won't go ready,
      # so the rollout halts instead of serving stale schema.
      initContainers:
        - name: migrate
          image: ghcr.io/openshiksha/openshiksha-backend:qa  # overlay rewrites tag
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: openshiksha-config
            - secretRef:
                name: openshiksha-secrets
      containers:
        - name: backend
          image: ghcr.io/openshiksha/openshiksha-backend:qa  # overlay rewrites tag
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: openshiksha-config
            - secretRef:
                name: openshiksha-secrets
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                # kubelet probes use the pod IP as Host, which isn't in
                # ALLOWED_HOSTS -> Django 400s. `backend` is in ALLOWED_HOSTS for
                # both qa and prod overlays, so send it explicitly.
                - name: Host
                  value: backend
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                # kubelet probes use the pod IP as Host, which isn't in
                # ALLOWED_HOSTS -> Django 400s. `backend` is in ALLOWED_HOSTS for
                # both qa and prod overlays, so send it explicitly.
                - name: Host
                  value: backend
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
