# The retired monolith under legacy/ is archived as-is — never lint, format, or
# auto-fix it.
exclude: ^legacy/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # k8s manifests routinely concatenate multiple resources in one file
        # with `---` separators (Service + StatefulSet, etc.). Without this
        # flag, check-yaml errors on every k8s/base/*.yaml file.
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=120]
        files: ^backend/

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]
        files: ^backend/

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^backend/
        args: [--config=backend/.flake8]
