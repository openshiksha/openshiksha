name: CI/CD Pipeline
# This workflow is triggered on pushes to the repository.
on: push

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Code Quality Tools
              run: pip install black==26.3.1 flake8==7.1.1 isort==5.13.2
              working-directory: backend
            - name: Check formatting (black)
              run: black --check --line-length=120 openshiksha/
              working-directory: backend
            - name: Check import order (isort)
              run: isort --check --profile=black --line-length=120 openshiksha/
              working-directory: backend
            - name: Check style (flake8)
              run: flake8 openshiksha/
              working-directory: backend

    typecheck:
        name: Type Check (mypy)
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: backend
            - name: Run mypy
              run: mypy openshiksha/
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install pip-audit
              run: pip install pip-audit==2.8.0
            - name: Audit dependencies for known CVEs
              # GHSA-grgv-6hw6-v9g4: twisted CVE — fix only in 26.4.0rc2 (pre-release, not on PyPI stable).
              # Ignored until twisted 26.4.0 stable is released.
              # PYSEC-2025-183: pyjwt "weak encryption" — disputed by maintainers (key length is
              # chosen by the application using the library, not by pyjwt itself). No fix released.
              run: pip-audit -r requirements.txt --ignore-vuln GHSA-grgv-6hw6-v9g4 --ignore-vuln PYSEC-2025-183
              working-directory: backend

    test:
        name: Test
        runs-on: ubuntu-latest
        # No external services needed — tests use SQLite in-memory and LocMemCache
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: backend
            - name: Run Django system check
              run: python manage.py check
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production
            - name: Check for missing migrations
              # Fails if a model was changed without a matching migration.
              # `makemigrations --check` (not `migrate --check`) is what detects
              # model/migration drift; --dry-run avoids writing any files.
              run: python manage.py makemigrations --check --dry-run
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production
            - name: Run migrations
              run: python manage.py migrate
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.test
                SECRET_KEY: test-secret-key-not-for-production
            - name: Run Tests
              # Coverage threshold (--cov-fail-under) is enforced via pytest.ini addopts.
              # Currently set to 90%; measured at 91.6% as of 2026-05-26.
              run: python -m pytest
              working-directory: backend
              env:
                SECRET_KEY: test-secret-key-not-for-production
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-report
                path: backend/coverage.xml
                retention-days: 14

    frontend:
        name: Frontend (Lint, Types, Tests)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend_modern
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend_modern/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Audit dependencies for known CVEs
              run: npm audit --audit-level=high
            - name: Lint (ESLint)
              run: npm run lint
            - name: Type check (TypeScript)
              run: npm run type-check
            - name: Run tests (Vitest)
              run: npm test -- --run
            - name: Build
              run: npm run build

    build-publish:
        name: Build & Publish
        needs: [lint, typecheck, security, test, frontend]
        # only run this on qa & prod branches
        if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Extract Branch name for Tagging
              run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
              id: extract_branch
            - name: Build Docker Image & Push to GitHub Container Registry
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    ghcr.io/${{ github.repository }}:${{ steps.extract_branch.outputs.branch }}
                    ghcr.io/${{ github.repository }}:${{ github.sha }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    deploy-prod:
        name: Deploy to Cluster
        needs: build-publish
        # only run this on prod branch
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        steps:
            - name: Set Cluster Context
              uses: azure/k8s-set-context@v3
              with:
                method: kubeconfig
                kubeconfig: '${{ secrets.KUBECONFIG }}'
                context: k3s-personal-server
            - name: Restart pods
              run: kubectl rollout restart deployment openshiksha openshiksha-celery-worker openshiksha-celery-beat -n openshiksha
