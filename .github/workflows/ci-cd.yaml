name: CI/CD Pipeline
# This workflow is triggered on pushes to the repository.
on: push

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        services:
            db:
                image: postgres:15
                env:
                    POSTGRES_USER: openshiksha_app
                    POSTGRES_DB: openshiksha_test
                    POSTGRES_PASSWORD: testpass
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Setup Python Runtime
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: 'backend/requirements.txt'
            - name: Install Dependencies
              run: pip install -r requirements.txt
              working-directory: backend
            - name: Run Django system check
              run: python manage.py check
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.development
                DATABASE_URL: postgresql://openshiksha_app:testpass@localhost:5432/openshiksha_test
                REDIS_URL: redis://localhost:6379/0
                SECRET_KEY: test-secret-key-not-for-production
                DEBUG: "True"
            - name: Run migrations
              run: python manage.py migrate
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.development
                DATABASE_URL: postgresql://openshiksha_app:testpass@localhost:5432/openshiksha_test
                REDIS_URL: redis://localhost:6379/0
                SECRET_KEY: test-secret-key-not-for-production
                DEBUG: "True"
            - name: Run Tests
              run: python -m pytest --tb=short -q
              working-directory: backend
              env:
                DJANGO_SETTINGS_MODULE: openshiksha.settings.development
                DATABASE_URL: postgresql://openshiksha_app:testpass@localhost:5432/openshiksha_test
                REDIS_URL: redis://localhost:6379/0
                SECRET_KEY: test-secret-key-not-for-production
                DEBUG: "True"

    build-publish:
        name: Build & Publish
        needs: test
        # only run this on qa & prod branches
        if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Extract Branch name for Tagging
              run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
              id: extract_branch
            - name: Build Docker Image & Push to GitHub Container Registry
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    ghcr.io/${{ github.repository }}:${{ steps.extract_branch.outputs.branch }}
                    ghcr.io/${{ github.repository }}:${{ github.sha }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    deploy-prod:
        name: Deploy to Cluster
        needs: build-publish
        # only run this on prod branch
        if: github.ref == 'refs/heads/prod'
        runs-on: ubuntu-latest
        steps:
            - name: Set Cluster Context
              uses: azure/k8s-set-context@v3
              with:
                method: kubeconfig
                kubeconfig: '${{ secrets.KUBECONFIG }}'
                context: k3s-personal-server
            - name: Restart pods
              run: kubectl rollout restart deployment openshiksha openshiksha-celery-worker openshiksha-celery-beat -n openshiksha
