apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openshiksha
  annotations:
    # cert-manager auto-issues + renews the Let's Encrypt cert for the tls hosts
    # below (ClusterIssuer `letsencrypt-prod` must exist on the cluster).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    # Apex and www both serve the app so www.openshiksha.org resolves rather than
    # 404ing. (Future nicety: 301 www -> apex via a Traefik redirect middleware.)
    - host: openshiksha.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /django-admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Grafana (OACT-3 monitoring stack), served at /grafana. Login-gated;
          # Grafana serves from this sub-path (GF_SERVER_SERVE_FROM_SUB_PATH=true)
          # so no strip-prefix middleware is needed. The grafana Service only
          # exists once an operator applies k8s/monitoring; until then /grafana 503s.
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.openshiksha.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /django-admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # TLS via cert-manager — SAN cert covering apex + www.
  tls:
    - hosts:
        - openshiksha.org
        - www.openshiksha.org
      secretName: openshiksha-tls
