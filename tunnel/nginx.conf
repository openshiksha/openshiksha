# Reverse-proxy fronting both frontend (vite dev server) and backend (Django
# runserver) on a single port so a Cloudflare quick tunnel can expose the
# whole app at one *.trycloudflare.com URL.
#
# Mirrors what the k8s Ingress will do in qa/prod (/api, /admin, /static →
# backend; everything else → frontend).
upstream frontend {
    server frontend:5173;
}
upstream backend {
    server backend:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # Big bodies for question imports / file uploads.
    client_max_body_size 25m;

    # Backend routes.
    location ~ ^/(api|admin|static|media|healthz)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }

    # Vite HMR websocket — vite serves its HMR socket on the same port as the
    # dev server. The Upgrade headers below let it survive the tunnel.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }
}
